<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="student-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.35" />
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <g filter="url(#student-shadow)">
    <!-- 连帽衫身体 (Hoodie Shoulders) -->
    <path d="M 48 240 C 48 180, 208 180, 208 240 Z" fill="url(#hoodie)" />
    <!-- 连帽衫领口 V 型 -->
    <path d="M 108 190 Q 128 220 148 190" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />

    <!-- 脖子 -->
    <rect x="112" y="160" width="32" height="30" rx="8" fill="#fdba74" />

    <!-- 脸部 (Face) -->
    <rect x="76" y="80" width="104" height="104" rx="46" fill="url(#skin)" />

    <!-- 头发 (Hair) -->
    <path d="M 68 110 C 68 50, 188 50, 188 110 C 188 74, 160 62, 128 62 C 96 62, 68 74, 68 110 Z" fill="url(#hair)" />
    <!-- 额前刘海 -->
    <path d="M 80 82 Q 105 105 130 84 Q 155 105 176 82" fill="none" stroke="url(#hair)" stroke-width="12" stroke-linecap="round" />

    <!-- 时尚眼镜 (Glasses) -->
    <rect x="86" y="112" width="34" height="24" rx="8" fill="none" stroke="#475569" stroke-width="4" />
    <rect x="136" y="112" width="34" height="24" rx="8" fill="none" stroke="#475569" stroke-width="4" />
    <line x1="120" y1="124" x2="136" y2="124" stroke="#475569" stroke-width="4" />

    <!-- 眼睛 -->
    <circle cx="103" cy="124" r="4" fill="#1e293b" />
    <circle cx="153" cy="124" r="4" fill="#1e293b" />

    <!-- 腮红与微笑 -->
    <circle cx="88" cy="142" r="7" fill="#fca5a5" opacity="0.6" />
    <circle cx="168" cy="142" r="7" fill="#fca5a5" opacity="0.6" />
    <path d="M 118 152 Q 128 162 138 152" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
