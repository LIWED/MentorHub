<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="teacher-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.35" />
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hair-teacher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <g filter="url(#teacher-shadow)">
    <!-- 教师正装西装与衬衫 (Blazer & Shirt) -->
    <path d="M 44 240 C 44 180, 212 180, 212 240 Z" fill="url(#blazer)" />
    <!-- 白色衬衫与领带 -->
    <polygon points="110,185 146,185 138,240 118,240" fill="#ffffff" />
    <polygon points="124,195 132,195 134,228 128,236 122,228" fill="#3b82f6" />

    <!-- 脖子 -->
    <rect x="112" y="158" width="32" height="30" rx="6" fill="#fdba74" />

    <!-- 脸部 (Face) -->
    <rect x="76" y="76" width="104" height="106" rx="44" fill="url(#skin)" />

    <!-- 儒雅发型 -->
    <path d="M 68 106 C 68 46, 188 46, 188 106 C 188 68, 156 56, 128 56 C 96 56, 68 68, 68 106 Z" fill="url(#hair-teacher)" />
    <!-- 侧分发缕 -->
    <path d="M 74 76 Q 115 65 145 76 Q 170 85 182 98" fill="none" stroke="url(#hair-teacher)" stroke-width="12" stroke-linecap="round" />

    <!-- 金丝圆框眼镜 (Gold Glasses) -->
    <circle cx="102" cy="120" r="16" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    <circle cx="154" cy="120" r="16" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    <line x1="118" y1="120" x2="138" y2="120" stroke="#f59e0b" stroke-width="3.5" />

    <!-- 眼睛与和蔼眉毛 -->
    <circle cx="102" cy="120" r="4" fill="#1e293b" />
    <circle cx="154" cy="120" r="4" fill="#1e293b" />
    <path d="M 88 100 Q 102 96 116 100" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 140 100 Q 154 96 168 100" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />

    <!-- 和蔼笑容 -->
    <path d="M 116 150 Q 128 160 140 150" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
